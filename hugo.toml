baseURL = "http://localhost:1313/"

# Change the default theme to be use when building the site with Hugo
theme = "LoveIt"

# website title
title = "My Computer Science Journey"

# language code ["en", "zh-CN", "fr", "pl", ...]
locale = "en"
languageName = "English"

# whether to include Chinese/Japanese/Korean
hasCJKLanguage = false

# copyright description used only for seo schema
copyright = ""

# whether to use robots.txt
enableRobotsTXT = true

# whether to use git commit log
enableGitInfo = true

# whether to use emoji code
enableEmoji = true

# ignore some build errors
ignoreErrors = ["error-remote-getjson", "error-missing-instagram-accesstoken"]

# Pagination config
[pagination]
  disableAliases = false
  pagerSize = 10
  path = "page"

# Menu config
[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
  [[menu.main]]
    weight = 2
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
  [[menu.main]]
    weight = 3
    identifier = "categories"
    name = "Categories"
    url = "/categories/"

[params]
  # site default theme ["auto", "light", "dark"]
  defaultTheme = "auto"
  gitRepo = ""
  fingerprint = ""
  dateFormat = "2006-01-02"
  title = "My Computer Science Journey"
  description = "Tracking my academic progress, software projects, and growth."
  images = ["/logo.png"]

# Author config
  [params.author]
    name = "Charuka Dilshan"
    email = ""
    link = ""

  # Header config
  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      logo = ""
      name = "Charuka's Blog"
      pre = ""
      post = ""
      typeit = false

  # Footer config
  [params.footer]
    enable = true
    custom = ''
    hugo = true
    copyright = true
    author = true
    since = 2026
    icp = ""
    license = '<a rel="license external nofollow noopener noreffer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'

  # Section (all posts) page config
  [params.section]
    paginate = 20
    dateFormat = "01-02"
    rss = 10

  # List (category or tag) page config
  [params.list]
    paginate = 20
    dateFormat = "01-02"
    rss = 10

  # App icon config
  [params.app]
    title = "My Computer Science Journey"
    noFavicon = false
    svgFavicon = ""
    themeColor = "#ffffff"
    iconColor = "#5bbad5"
    tileColor = "#da532c"

  # Search config
  [params.search]
    enable = true
    type = "lunr"
    contentLength = 4000
    placeholder = ""
    maxResultLength = 10
    snippetLength = 30
    highlightTag = "em"
    absoluteURL = false
    [params.search.algolia]
      index = ""
      appID = ""
      searchKey = ""

  # Home page config
  [params.home]
    rss = 10
    # Home page profile
    [params.home.profile]
      enable = true
      gravatarEmail = ""
      avatarURL = ""
      title = "Hi, I'm Charuka Dilshan"
      subtitle = "Computer Science Undergraduate | Building & Learning in Public"
      typeit = true
      social = true
      disclaimer = ""
    # Home page posts
    [params.home.posts]
      enable = true
      paginate = 6
      defaultHiddenFromHomePage = false

  # Social config about the author
  [params.social]
    GitHub = "CharukaDilshan"
    Linkedin = ""
    X = ""
    Twitter = ""
    Instagram = ""
    Facebook = ""
    Telegram = ""
